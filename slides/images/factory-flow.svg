<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">The factory flow</title>
<desc id="desc">A human with AI writes a spec. An agent picks it up, asks the human if something is unclear, and opens a pull request. Humans and AI review it and either send it back for changes or merge it.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8a875"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#eee">
<g fill="#363636" stroke="#ddd" stroke-width="2">
<rect x="20" y="110" width="180" height="80" rx="8"/><rect x="240" y="110" width="140" height="80" rx="8"/>
<rect x="420" y="110" width="140" height="80" rx="8"/><rect x="600" y="110" width="160" height="80" rx="8"/>
<rect x="800" y="110" width="200" height="80" rx="8"/><rect x="1040" y="110" width="140" height="80" rx="8"/>
</g>
<g text-anchor="middle" font-size="24">
<text x="110" y="158">Human + AI</text><text x="310" y="158">Spec</text><text x="490" y="158">Agent</text>
<text x="680" y="143">Pull</text><text x="680" y="173">request</text>
<text x="900" y="143">Review</text><text x="900" y="173">humans + AI</text>
<text x="1110" y="158">Merge</text>
</g>
<g fill="none" stroke="#f8a875" stroke-width="3" marker-end="url(#arrow)">
<path d="M204 150H233"/><path d="M384 150H413"/><path d="M564 150H593"/><path d="M764 150H793"/><path d="M1004 150H1033"/>
<path d="M490 106V50H110V103" stroke-dasharray="8 6"/>
<path d="M900 194V245H490V197"/>
</g>
<g text-anchor="middle" font-size="19" fill="#f8a875">
<text x="300" y="40">questions</text><text x="695" y="272">changes</text><text x="1020" y="98">approve</text>
</g>
</g></svg>
