<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">My factory</title>
<desc id="desc">A human with AI writes specs as tasks in GitHub Projects. A runner app on an always-on Mac Studio polls GitHub for tasks. Nimble, a local model, picks an AI model for the task. If there are enough tokens, the runner spawns agents. The agents read and write comments on the tasks and open pull requests, which the human reviews.</desc>
